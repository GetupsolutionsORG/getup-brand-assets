name: Decode signature images
on:
  push:
    paths: ["b64/**", ".github/workflows/decode.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 to PNG
        run: |
          mkdir -p email-signature
          for f in b64/*.txt; do n=$(basename "$f" .txt); tr -d ' \n\r' < "$f" | base64 -d > "email-signature/$n.png"; done
          sha256sum email-signature/*.png
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add email-signature
          git diff --cached --quiet || git commit -m "Decode signature images"
          git push
